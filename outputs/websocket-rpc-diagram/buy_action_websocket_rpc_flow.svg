<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="100%" stop-color="#f2dfbd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#5c3820" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowBrown" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#70452a"/>
    </marker>
    <marker id="arrowRed" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#a34032"/>
    </marker>
    <style>
      .title { font: 700 46px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #392819; }
      .subtitle { font: 400 24px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #715d49; }
      .h { font: 700 25px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #392819; }
      .h2 { font: 700 21px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #392819; }
      .body { font: 400 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #4c3927; }
      .small { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #6e5944; }
      .code { font: 600 17px Consolas, "Microsoft YaHei", monospace; fill: #2f241c; }
      .chip { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #ffffff; }
      .label { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #a34032; }
      .box { fill: rgba(255,255,255,0.88); stroke: #d3b579; stroke-width: 2; rx: 12; filter: url(#shadow); }
      .box2 { fill: rgba(255,248,232,0.92); stroke: #d3b579; stroke-width: 2; rx: 12; filter: url(#shadow); }
      .darkBox { fill: #4f3222; stroke: #4f3222; stroke-width: 2; rx: 12; filter: url(#shadow); }
      .redLine { stroke: #a34032; stroke-width: 4; fill: none; marker-end: url(#arrowRed); }
      .line { stroke: #70452a; stroke-width: 3.2; fill: none; marker-end: url(#arrowBrown); }
      .thin { stroke: #b89056; stroke-width: 2; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrowBrown); }
    </style>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#bg)"/>
  <rect x="34" y="34" width="1852" height="1012" fill="none" stroke="#8c4d76" stroke-width="8"/>
  <rect x="52" y="52" width="1816" height="976" fill="none" stroke="#b981a7" stroke-width="2"/>

  <text x="82" y="96" class="title">buy 动作的 WebSocket 伪 RPC 调用链</text>
  <text x="84" y="132" class="subtitle">通过多层封装，Python 后端把 Unity 场景调用写成近似函数调用：client.buy(...) → send(...) → Unity 执行 → complete 回执</text>

  <rect x="82" y="166" width="344" height="48" rx="10" fill="#a34032"/>
  <text x="112" y="197" class="chip">Python 后端：动作与世界状态</text>
  <rect x="486" y="166" width="448" height="48" rx="10" fill="#355f4c"/>
  <text x="516" y="197" class="chip">WebSocketServer：函数式抽象层</text>
  <rect x="996" y="166" width="330" height="48" rx="10" fill="#c6963d"/>
  <text x="1026" y="197" class="chip">统一 send()：伪 RPC 内核</text>
  <rect x="1388" y="166" width="448" height="48" rx="10" fill="#70452a"/>
  <text x="1418" y="197" class="chip">Unity 执行层：WsAgentClient</text>

  <!-- Python action layer -->
  <rect x="82" y="248" width="344" height="172" class="box"/>
  <text x="112" y="286" class="h">1. ActionExecutor</text>
  <text x="112" y="322" class="body">LLM 输出动作提案后，规则系统校验：</text>
  <text x="132" y="354" class="small">must_be_at(location:market)</text>
  <text x="132" y="380" class="small">must_have_stock()</text>
  <text x="132" y="406" class="small">must_have_enough_money()</text>

  <rect x="82" y="458" width="344" height="184" class="box2"/>
  <text x="112" y="496" class="h">2. handle_buy(ctx, act)</text>
  <text x="112" y="532" class="code">unit_price = market.price(item)</text>
  <text x="112" y="560" class="code">total = unit_price * qty</text>
  <text x="112" y="596" class="code">await ctx.world.client.buy(</text>
  <text x="132" y="624" class="code">actor.id, qty, total, source, item_id)</text>

  <path d="M254 420 L254 458" class="redLine"/>

  <!-- WebSocketServer abstraction -->
  <rect x="486" y="258" width="448" height="104" class="box"/>
  <text x="516" y="296" class="h">3. 顶层动作封装：buy(...)</text>
  <text x="516" y="331" class="code">WebSocketServer.buy(actor_id, qty, money, source, item_id)</text>

  <rect x="486" y="402" width="448" height="250" class="box2"/>
  <text x="516" y="440" class="h">4. buy 内部拆成 3 个前端调用</text>
  <rect x="520" y="470" width="374" height="46" rx="8" fill="#ffffff" stroke="#d3b579" stroke-width="1.6"/>
  <text x="540" y="499" class="code">show_animation(item, +qty)</text>
  <text x="714" y="499" class="small">显示物品增加</text>
  <rect x="520" y="534" width="374" height="46" rx="8" fill="#ffffff" stroke="#d3b579" stroke-width="1.6"/>
  <text x="540" y="563" class="code">move(source, "收银台")</text>
  <text x="714" y="563" class="small">人物移动到收银台</text>
  <rect x="520" y="598" width="374" height="46" rx="8" fill="#ffffff" stroke="#d3b579" stroke-width="1.6"/>
  <text x="540" y="627" class="code">show_animation("money", -total)</text>
  <text x="782" y="627" class="small">显示扣钱</text>

  <path d="M426 550 C456 550 456 310 486 310" class="redLine"/>

  <!-- send core -->
  <rect x="996" y="248" width="330" height="156" class="box"/>
  <text x="1026" y="286" class="h">5. 中层函数统一落到 send()</text>
  <text x="1026" y="322" class="body">show_animation / move 本质上只是在</text>
  <text x="1026" y="350" class="body">补充 type、cmd、target、value 等参数。</text>
  <text x="1026" y="382" class="small">返回值统一：is_success(result)</text>

  <rect x="996" y="444" width="330" height="272" class="box2"/>
  <text x="1026" y="482" class="h">6. send() 伪 RPC 内核</text>
  <text x="1026" y="520" class="code">action_id = uuid.uuid4()</text>
  <text x="1026" y="550" class="code">pending[action_id] = Future</text>
  <text x="1026" y="580" class="code">ws.send(json.dumps(payload))</text>
  <text x="1026" y="610" class="code">wait_for(fut, timeout=20)</text>
  <rect x="1026" y="642" width="270" height="46" rx="8" fill="#4f3222"/>
  <text x="1050" y="671" class="chip">等待 Unity complete 回填 Future</text>

  <path d="M934 493 L996 493" class="line"/>
  <path d="M934 557 L996 557" class="line"/>
  <path d="M934 621 L996 621" class="line"/>

  <!-- Payloads -->
  <rect x="1388" y="246" width="448" height="192" class="box"/>
  <text x="1418" y="284" class="h">7. 实际发出的消息示例</text>
  <text x="1418" y="322" class="code">{ type:"animation", target:"bread", value:+2 }</text>
  <text x="1418" y="354" class="code">{ type:"command", cmd:"go_to", target:"收银台" }</text>
  <text x="1418" y="386" class="code">{ type:"animation", target:"money", value:-14 }</text>
  <text x="1418" y="420" class="small">每条消息都有 agent_id 和 action_id</text>

  <rect x="1388" y="478" width="448" height="258" class="box2"/>
  <text x="1418" y="516" class="h">8. Unity 侧路由与执行</text>
  <text x="1418" y="552" class="body">WsAgentClient.HandleRoutedMessage(msg)</text>
  <text x="1440" y="590" class="small">command + go_to → navigator.AddCommand(...)</text>
  <text x="1440" y="620" class="small">command + 其它 cmd → navigator.AddCommand(...)</text>
  <text x="1440" y="650" class="small">animation → animationQueue.Enqueue(...)</text>
  <text x="1440" y="680" class="small">完成后 SendJsonShared(type="complete", status="ok")</text>

  <path d="M1326 580 C1352 580 1358 340 1388 340" class="line"/>
  <path d="M1612 478 L1612 438" class="thin"/>

  <!-- Return path -->
  <rect x="996" y="784" width="840" height="132" class="darkBox"/>
  <text x="1028" y="824" class="chip">回执路径：Unity complete → WebSocketServer._handle() → pending.pop(action_id) → fut.set_result(msg)</text>
  <text x="1028" y="864" class="chip">send() 恢复执行 → is_success(result) → buy 子调用继续下一步</text>
  <text x="1028" y="902" class="chip">三个子调用均成功后，handle_buy() 才修改 Python 世界状态并广播市场 / Agent 信息</text>
  <path d="M1612 736 C1612 760 1510 764 1510 784" class="thin"/>
  <path d="M996 850 C760 850 650 728 650 652" class="thin"/>
  <path d="M650 784 C430 784 254 692 254 642" class="thin"/>

  <!-- World state after remote calls -->
  <rect x="82" y="720" width="850" height="230" class="box"/>
  <text x="112" y="758" class="h">9. Unity 动作成功后，Python 再结算真实世界状态</text>
  <text x="112" y="800" class="code">actor.inventory.add(item_id, qty)</text>
  <text x="112" y="830" class="code">actor.money -= total</text>
  <text x="112" y="860" class="code">market.remove_stock(item_id, qty)</text>
  <text x="112" y="890" class="code">shop_assistant.money += total</text>
  <text x="512" y="800" class="code">_broadcast_market_information(ctx)</text>
  <text x="512" y="830" class="code">_broadcast_message(ctx, ...)</text>
  <text x="512" y="860" class="code">_broadcast_agent_information(ctx)</text>
  <text x="112" y="928" class="label">关键点：Unity 只负责表现与回执，权威状态仍在 Python WorldState 中更新。</text>

  <!-- Bottom thesis -->
  <rect x="82" y="986" width="1754" height="42" rx="12" fill="#fff1c8" stroke="#d3b579" stroke-width="2"/>
  <text x="114" y="1014" class="h2">这页要讲的核心：</text>
  <text x="310" y="1014" class="body">我没有引入 RPC 框架，但通过顶层动作函数、中层通信函数和统一 send()，把 Unity 前端包装成了 Python 后端可 await 的“远端函数”。</text>
</svg>
